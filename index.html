<!doctype html>
<meta charset="utf-8">
<title>Inquiry Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: an International Typographic Style poster. Masthead with giant type and tabular counts; below it a modular grid where each rabbit hole is a numbered band and its questions are squares joined by heavy orthogonal bars. Colours come from the active theme (set by script on :root). */
:root{
  --paper:#0F1B2E; --surface:#15243B; --ink:#F1EBDD; --ink-2:#AEB6C6; --grey:#64718A; --hair:#22324D; --a:#FFC23D;
  --face:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--face);font-size:14px;overflow:hidden;font-variant-numeric:tabular-nums;transition:background-color .3s}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;position:relative}

/* masthead */
.mast{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 28px;padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:6px solid var(--ink);background:var(--paper);position:relative;z-index:3}
.mast h1{margin:0;font-weight:900;font-size:34px;line-height:1;letter-spacing:-.045em;white-space:nowrap}
.sum{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.sum b{color:var(--ink);font-weight:800}
.sum .hot b{color:var(--a)}
.mast h1 b{color:var(--a);font-weight:900;display:inline-block}
.mast h1:hover b{animation:dot .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes dot{40%{transform:translateY(-22%) scale(1.3)}}
.mid{display:grid;grid-template-columns:auto 1fr;gap:14px 36px;align-items:end;min-width:0}
.colophon{display:grid;gap:3px;font-size:11.5px;font-weight:600;line-height:1.25;border-left:2px solid var(--ink);padding-left:10px}
.colophon span{color:var(--ink-2);font-weight:500}
.colophon .ex{color:var(--a);font-weight:700}
.figs{display:flex;flex-wrap:wrap;gap:10px 26px;min-width:0}
.fig{display:grid;gap:2px;overflow:hidden}
.fig b{font-size:46px;line-height:.86;font-weight:800;letter-spacing:-.04em;display:inline-block}
.fig b.bump{animation:bump .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{0%{transform:translateY(60%);opacity:0}}
.fig span{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
.fig.hot b{color:var(--a)}
.tools{display:flex;gap:10px;align-self:start;flex-wrap:wrap;justify-content:flex-end}
.tb{height:38px;padding:0 15px;border:2.5px solid var(--ink);font-weight:800;font-size:13px;letter-spacing:-.005em;background:var(--paper);white-space:nowrap;box-shadow:3px 3px 0 var(--ink);transition:transform .07s ease-out,box-shadow .07s ease-out,background-color .15s,color .15s}
.tb:hover{background:var(--surface)}
.tb:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.tb.primary{background:var(--ink);color:var(--paper)}
.tb.primary:hover{background:var(--a);border-color:var(--a);color:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.tb[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.savebtn{display:flex;align-items:center;gap:8px;font-weight:700}
.savebtn i{width:10px;height:10px;background:var(--grey);display:block;flex:none}
.savebtn[data-st="saved"] span,.savebtn[data-st="local"] span,.savebtn[data-st="pending"] span,.savebtn[data-st="saving"] span{display:none}
.savebtn[data-st="saved"] i{background:var(--a)}
.savebtn[data-st="pending"] i,.savebtn[data-st="saving"] i{background:var(--a);animation:blink .5s steps(2) infinite}
.savebtn[data-st="reconnect"] i,.savebtn[data-st="error"] i{background:#FF5A4E}
.savebtn.flash i{animation:flash .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes blink{50%{opacity:.2}}
@keyframes flash{40%{transform:scale(1.8) rotate(45deg)}}

/* poster field */
.field{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain;background:var(--paper)}
svg#poster{display:block}
svg .nd{cursor:pointer}
svg .nd:focus{outline:none}
svg .nd:focus-visible .hit{stroke:var(--a);stroke-width:2;stroke-dasharray:4 3}
svg .nd:hover .gl{transform:scale(1.12)}
svg .gl{transform-box:fill-box;transform-origin:center;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
svg .lb{font-family:var(--face);font-weight:600;font-size:13.5px;letter-spacing:-.01em}
svg .lb .cd{font-weight:800;font-size:11px;letter-spacing:.02em}
svg .rt{font-family:var(--face);font-weight:800;font-size:27px;letter-spacing:-.035em}
svg .rm{font-family:var(--face);font-weight:600;font-size:11.5px}
svg .num{font-family:var(--face);font-weight:900;letter-spacing:-.07em}
svg.intro .band{animation:slide .8s cubic-bezier(.16,.84,.2,1) both}
svg.intro .band .bars{animation:grow .9s cubic-bezier(.16,.84,.2,1) both}
@keyframes slide{from{transform:translateX(-70px)}}
@keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
svg .nd.pop .gl{animation:pop .55s cubic-bezier(.34,1.8,.5,1)}
@keyframes pop{35%{transform:scale(1.5) rotate(10deg)}}
svg .nd.born .gl{animation:born .5s cubic-bezier(.34,1.6,.5,1) .28s both}
@keyframes born{from{transform:scale(0) rotate(-90deg)}}
svg .nd.born .lb{animation:fade .4s .4s both}
@keyframes fade{from{opacity:0}}
svg path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s cubic-bezier(.5,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg .arr.slide{animation:arr .4s cubic-bezier(.2,.9,.3,1)}
@keyframes arr{from{transform:translateX(-28px);opacity:0}}
svg .frame{transform-box:fill-box;transform-origin:center}
svg .frame.slide{animation:frame .35s cubic-bezier(.2,.9,.3,1)}
@keyframes frame{from{transform:scale(1.7) rotate(45deg);opacity:0}}

/* panels */
.key{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;width:300px;background:var(--surface);border-top:6px solid var(--ink);box-shadow:0 0 0 1px var(--ink)}
.key h2,.pop h2{margin:0;padding:9px 12px 8px;font-size:13px;font-weight:900;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink)}
.key h2 span,.pop h2 span{font-weight:600;color:var(--ink-2)}
.key table{width:100%;border-collapse:collapse;font-size:12px}
.key td{padding:7px 12px;border-bottom:1px solid var(--hair);vertical-align:middle}
.key tr:last-child td{border-bottom:0}
.key td:first-child{width:34px;padding-right:0}
.key td b{font-weight:800}
.key td.d{color:var(--ink-2)}
.key td.n{text-align:right;font-weight:800;font-size:15px;letter-spacing:-.02em}
.key td svg{display:block}
.pop{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));z-index:6;width:min(380px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-top:6px solid var(--ink);box-shadow:0 0 0 1px var(--ink),10px 10px 0 var(--a)}
.pop:not([hidden]),.key.open{animation:drop .32s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{clip-path:inset(0 0 100% 0);transform:translateY(-8px)}to{clip-path:inset(0 0 -20px -20px)}}
.pop .x{width:26px;height:26px;font-size:18px;font-weight:800;line-height:1;color:var(--ink)}
.pop .in{padding:12px;display:grid;gap:16px}
.opt{display:grid;gap:7px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.opt>small{font-weight:500;color:var(--grey);font-size:11px;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;border:2px solid var(--ink)}
.seg button{flex:1 1 auto;padding:7px 9px;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:transform .07s}
.seg button:active{transform:scale(.94)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{display:grid;gap:0;text-align:left;border:2px solid var(--ink);transition:transform .1s cubic-bezier(.3,1.6,.5,1)}
.th:hover{transform:translateY(-2px)}
.th:active{transform:scale(.95)}
.th[aria-pressed="true"]{box-shadow:4px 4px 0 var(--a)}
.th .sw{height:46px;position:relative;display:block;overflow:hidden}
.th .sw i{position:absolute;display:block}
.th .nm{font-size:11.5px;font-weight:800;padding:5px 7px;background:var(--surface);color:var(--ink);border-top:2px solid var(--ink)}
.spots{display:flex;flex-wrap:wrap;gap:8px}
.spot{width:30px;height:30px;border:2px solid var(--ink);display:grid;place-items:center;font-size:10px;font-weight:800;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.spot[data-v=""]{width:auto;padding:0 8px;background:var(--paper);color:var(--ink)}
.spot:hover{transform:rotate(12deg)}
.spot[data-v=""]:hover{transform:translateY(-2px)}
.spot[aria-pressed="true"]{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.datarow{display:flex;flex-wrap:wrap;gap:8px}
.datarow .tb{height:34px;font-size:12px;padding:0 11px;box-shadow:2px 2px 0 var(--ink)}
.datarow .tb:active{transform:translate(2px,2px);box-shadow:none}
.datast{font-size:12px;font-weight:600;color:var(--ink);line-height:1.4}
.ghbox{display:grid;gap:9px;border-top:2px solid var(--ink);padding-top:12px;margin-top:6px}
.ghbox>b{font-size:13px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.ghst{font-size:12px;font-weight:600;color:var(--ink);line-height:1.4}
.ghform{display:grid;gap:8px}
.ghbox label{display:grid;gap:4px;font-size:11px;font-weight:700;color:var(--ink-2)}
.ghbox input{height:34px;border:2px solid var(--ink);background:var(--paper);padding:0 9px;font-size:13px;font-weight:600;color:var(--ink);outline:none;min-width:0}
.ghbox input:focus{border-color:var(--a)}
.ghbox details{display:grid;gap:8px}
.ghbox summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.ghbox small{font-weight:500;color:var(--grey);font-size:11px;line-height:1.4}
.danger{border-color:#FF5A4E!important;color:#FF5A4E}
.danger.armed{background:#FF5A4E;color:#fff}

/* inspector */
.insp{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;width:min(380px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-top:6px solid var(--a);box-shadow:0 0 0 1px var(--ink);animation:rise .3s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.insp .ih{align-items:center;gap:6px;padding:8px 8px 0 14px}
.peek{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;visibility:hidden}
.insp.mini .peek{visibility:visible}
.insp .ih .min{width:28px;height:28px;font-size:15px;border-width:2px}
.insp .ib{padding-top:6px}
.ih{display:flex;align-items:flex-end;gap:12px;padding:10px 14px 0}
.ih .code{font-size:44px;font-weight:900;line-height:.82;letter-spacing:-.05em;display:inline-block}
.ih .code.slide{animation:up .38s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(45%);opacity:0}}
.ih .kind{margin-left:auto;text-align:right;font-size:11px;font-weight:700;line-height:1.3;color:var(--ink-2)}
.ih .min{width:30px;height:30px;border:2px solid var(--ink);font-weight:900;font-size:16px;line-height:1;align-self:center;flex:none;transition:transform .15s}
.ih .min:active{transform:scale(.88)}
.insp.mini .ib{display:none}
.insp.mini .ih{padding-bottom:10px}
.ib{padding:12px 14px 14px;display:grid;gap:12px}
.ib label{font-size:11px;font-weight:700;color:var(--ink-2)}
.ib input{width:100%;border:0;border-bottom:3px solid var(--ink);background:transparent;padding:3px 0 7px;font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.15;outline:none;transition:border-color .2s}
.ib input:focus{border-bottom-color:var(--a)}
.ib input::placeholder,.ib textarea::placeholder{color:var(--grey)}
.ib textarea{width:100%;min-height:58px;resize:vertical;border:2px solid var(--ink);background:var(--paper);padding:8px 10px;font-size:13.5px;font-weight:500;line-height:1.45;outline:none}
.ib textarea:focus{border-color:var(--a)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink)}
.chip{display:grid;justify-items:start;gap:6px;padding:8px 8px 7px;font-size:11.5px;font-weight:800;text-align:left;transition:transform .07s}
.chip:active{transform:scale(.93)}
.chip+.chip{border-left:2px solid var(--ink)}
.chip[aria-pressed="true"]{background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 0/100% 100%;color:var(--paper)}
.chip.just{animation:wipe .3s cubic-bezier(.5,0,.2,1)}
@keyframes wipe{from{background-size:0% 100%}}
.chip svg{display:block}
.chip[aria-pressed="true"] svg{background:var(--paper)}
.acts{display:flex;gap:10px}
.acts .tb{flex:1}
.acts .del:hover{background:#FF5A4E;border-color:#FF5A4E;color:#fff}
.facts{margin:0;font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.facts b{color:var(--ink);font-weight:800}
.hint{margin:0;font-size:11px;color:var(--grey);font-weight:500}
kbd{font-family:var(--face);font-weight:800;font-size:10.5px;border:1.5px solid var(--grey);padding:0 4px;color:var(--ink-2)}
.empty{padding:12px 14px 16px;font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-.01em}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;display:block}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);font-weight:800;font-size:13px;padding:9px 14px;box-shadow:4px 4px 0 var(--a);animation:toast .35s cubic-bezier(.2,.9,.3,1)}
@keyframes toast{from{transform:translate(-50%,-140%)}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:wipein .6s cubic-bezier(.75,0,.2,1)}
@keyframes wipein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:760px){
  .mast{grid-template-columns:1fr auto;padding-block:10px 8px;border-bottom-width:5px}
  .mast h1{font-size:25px}
  .sum{grid-column:1/-1;grid-row:2;font-size:12px}
  .tools{gap:8px;flex-wrap:nowrap}
  .long{display:none}
  .tb{height:34px;padding:0 10px;font-size:12px}
  .ib input{font-size:18px}
  .chip{padding:7px 5px;font-size:10.5px}
  .themes{grid-template-columns:repeat(2,1fr)}
}
</style>

<div class="app">
  <header class="mast">
    <h1>Inquiry Grid<b>.</b></h1>
    <div class="sum" id="sum"></div>
    <div class="tools">
      <button class="tb savebtn" id="savebtn" data-st="local" title="Saved"><i></i><span id="savetxt"></span></button>
      <button class="tb" id="custom" aria-expanded="false">Customize</button>
      <button class="tb primary" id="add" aria-label="New question">+ New<span class="long"> question</span></button>
    </div>
  </header>

  <div class="field" id="field">
    <svg id="poster" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poster of your rabbit holes"></svg>
  </div>

  <section class="pop" id="pop" hidden aria-label="Customize">
    <h2>Customize<button class="x" id="closepop" aria-label="Close">×</button></h2>
    <div class="in">
      <div class="opt">Theme<div class="themes" id="themes"></div></div>
      <div class="opt">Spot colour<div class="spots" id="spots"></div></div>
      <div class="opt">Grid guides<div class="seg" id="guides"><button data-v="1">Visible</button><button data-v="0">Hidden</button></div></div>
      <div class="opt">Numerals<div class="seg" id="huge"><button data-v="1">Huge</button><button data-v="0">Modest</button></div></div>
      <div class="opt">Composition<div class="seg" id="axis"><button data-v="0">Flush left</button><button data-v="1">Centred axis</button></div></div>
      <div class="opt">Motion<div class="seg" id="motion"><button data-v="1">Lively</button><button data-v="0">Still</button></div></div>
      <div class="opt" id="data">Your data
        <div class="datast" id="datast"></div>
        <div class="datarow" id="filerow">
          <button class="tb" id="choose">Save to a file…</button>
          <button class="tb" id="openf">Open a file…</button>
          <button class="tb" id="forget" hidden>Stop using file</button>
        </div>
        <div class="datarow">
          <button class="tb" id="export">Export copy</button>
          <button class="tb" id="import">Import</button>
          <button class="tb danger" id="clear">Clear everything</button>
          <input type="file" id="importfile" accept=".json,application/json" hidden>
        </div>
        <div class="ghbox" id="ghbox">
          <b>GitHub sync</b>
          <div class="ghst" id="ghst"></div>
          <div class="ghform" id="ghform">
            <label for="ghrepo">Private repository<input id="ghrepo" placeholder="your-name/inquiry-grid-data" autocomplete="off" spellcheck="false"></label>
            <label for="ghdev">This device's name<input id="ghdev" placeholder="laptop" autocomplete="off"></label>
            <label for="ghtok">Access token<input id="ghtok" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></label>
            <details><summary>File and branch</summary><label for="ghpath">File path<input id="ghpath" autocomplete="off" spellcheck="false"></label><label for="ghbranch">Branch<input id="ghbranch" autocomplete="off" spellcheck="false"></label></details>
          </div>
          <div class="datarow"><button class="tb primary" id="ghconnect">Connect</button><button class="tb" id="ghnow" hidden>Sync now</button><button class="tb" id="ghoff" hidden>Disconnect</button></div>
        </div>
      </div>
    </div>
  </section>

  <aside class="insp" id="insp" aria-live="polite"></aside>
</div>
<div id="fx" aria-hidden="true"></div>

<script>
"use strict";
const ORDER=["unexplored","exploring","done","parked"];
const LABEL={unexplored:"Unexplored",exploring:"Exploring",done:"Done",parked:"Parked"};
const DESC={unexplored:"Not opened yet",exploring:"Reading into it now",done:"Understood, explained",parked:"Set aside for later"};
const KEY="inquiry-grid-v1";
const THEMES={
  ink:     {name:"Night Ink", paper:"#0F1B2E",surface:"#15243B",ink:"#F1EBDD",ink2:"#AEB6C6",grey:"#64718A",hair:"#22324D",a:"#FFC23D",dark:true},
  graphite:{name:"Graphite",  paper:"#161719",surface:"#1F2124",ink:"#ECEAE5",ink2:"#A5A39D",grey:"#66656A",hair:"#2C2E33",a:"#FF5533",dark:true},
  oxblood: {name:"Oxblood",   paper:"#290E13",surface:"#35141B",ink:"#F7E8DC",ink2:"#CDAAA2",grey:"#835C59",hair:"#4B2029",a:"#FF8FB4",dark:true},
  moss:    {name:"Moss",      paper:"#111F1A",surface:"#172A22",ink:"#E7F0E4",ink2:"#9EB4A6",grey:"#5A7165",hair:"#22392F",a:"#C6F35E",dark:true},
  ochre:   {name:"Ochre Riso",paper:"#E3BD5F",surface:"#EDCC7B",ink:"#1A1E38",ink2:"#3E4263",grey:"#8C7442",hair:"#C9A44E",a:"#D3263A",dark:false},
  concrete:{name:"Concrete",  paper:"#C6C4BE",surface:"#D3D1CB",ink:"#141414",ink2:"#393937",grey:"#7E7C76",hair:"#ADABA5",a:"#2340D8",dark:false}};
const SPOTS=["#FFC23D","#FF5533","#FF8FB4","#C6F35E","#4FC3F7","#D3263A","#2340D8","#F2F0EA"];
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mk=(text,status="unexplored",children=[])=>({id:newId(),text,status,children,note:"",u:Date.now(),p:0});
const seed=()=>[
  mk("How does Amazon remember my cart if HTTP is stateless?","exploring",[
    mk("What is HTTP?","done",[mk("What's in a request vs a response?","done"),mk("What does \"stateless\" mean?","exploring")]),
    mk("What's actually inside a cookie?","unexplored",[mk("What does the Secure flag do?","unexplored",[mk("What is HTTPS?","parked")])]),

  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){return undefined}},

function adopt(d){roots=d.roots;deleted=d.deleted||{};example=!!d.example;if(d.prefs)Object.assign(prefs,d.prefs);reindex();sel=null;applyPrefs();render()}
function valid(d){return d&&Array.isArray(d.roots)}
async function syncFromFile(){try{const txt=await(await handle.getFile()).text();
    if(!txt.trim()){await writeFile();return}
    const d=JSON.parse(txt);if(!valid(d))throw new Error("not an Inquiry Grid file");
    if(localSavedAt&&d.savedAt&&localSavedAt>d.savedAt){await writeFile();toast("Saved your newer browser copy to "+handle.name)}
    else{adopt(d);lastWrite=new Date();setSave("saved")}
  }catch(e){fileOK=false;setSave("error");toast("Couldn't read "+(handle&&handle.name)+": "+e.message)}}
async function initFile(){if(!FS){setSave("local");return}
  handle=await IDB.get("handle");if(!handle){setSave("local");return}
  try{const p=await handle.queryPermission({mode:"readwrite"});if(p==="granted"){fileOK=true;await syncFromFile()}else setSave("reconnect")}catch(e){setSave("reconnect")}}
async function reconnect(){try{const p=await handle.requestPermission({mode:"readwrite"});if(p==="granted"){fileOK=true;await syncFromFile();toast("Reconnected to "+handle.name)}}catch(e){toast("Couldn't reconnect: "+e.message)}}
const types=[{description:"Inquiry Grid data",accept:{"application/json":[".json"]}}];
$("#choose").onclick=async()=>{try{const h=await showSaveFilePicker({suggestedName:"inquiry-grid.json",types});handle=h;fileOK=true;await IDB.set("handle",h);await writeFile();toast("Now autosaving to "+h.name)}catch(e){if(e.name!=="AbortError")toast("Couldn't use that file: "+e.message)}};
$("#openf").onclick=async()=>{try{const[h]=await showOpenFilePicker({types});const p=await h.requestPermission({mode:"readwrite"});if(p!=="granted")return;handle=h;fileOK=true;await IDB.set("handle",h);localSavedAt="";await syncFromFile();toast("Opened "+h.name)}catch(e){if(e.name!=="AbortError")toast("Couldn't open that file: "+e.message)}};
$("#forget").onclick=async()=>{handle=null;fileOK=false;await IDB.set("handle",undefined);setSave("local");toast("Stopped using the file. Saving in this browser only.")};
$("#export").onclick=()=>{const blob=new Blob([JSON.stringify(payload(),replacer,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`inquiry-grid-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Exported a copy")};
$("#import").onclick=()=>$("#importfile").click();
$("#importfile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const d=JSON.parse(await f.text());if(!valid(d))throw new Error("not an Inquiry Grid file");adopt(d);save();toast("Imported "+f.name)}catch(err){toast("Couldn't import: "+err.message)}};
let armT;$("#clear").onclick=()=>{const b=$("#clear");if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Press again to clear";clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove("armed");b.textContent="Clear everything"},3000);return}
  clearTimeout(armT);b.classList.remove("armed");b.textContent="Clear everything";roots.forEach(tombstone);roots=[];example=false;sel=null;save();render();toast("Cleared. A fresh grid.")};
$("#savebtn").onclick=()=>{
  if(ghOn()){if(ghState==="error")openPop(true);else sync();return}
  if(saveState==="reconnect"&&handle){reconnect();return}openPop(true)};

/* ---------- GitHub sync: one JSON file in a private repo, merged question by question ---------- */
const GHKEY="inquiry-grid-github";
const guessDevice=()=>/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)?"phone":"laptop";
let gh={repo:"",path:"inquiry-grid.json",branch:"main",token:"",device:""},ghState="off",ghMsg="",lastSync=null,syncing=false,syncAgain=false,syncT=null;
try{Object.assign(gh,JSON.parse(localStorage.getItem(GHKEY))||{})}catch(e){}
if(!gh.device)gh.device=guessDevice();
function ghOn(){return!embedded&&!!(gh.repo&&gh.token)}
function ghSaveCfg(){try{localStorage.setItem(GHKEY,JSON.stringify(gh))}catch(e){}}
const b64e=s=>{const b=new TextEncoder().encode(s);let bin="";for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64d=s=>{const bin=atob(String(s).replace(/\s/g,""));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)};
function ghURL(){return`https://api.github.com/repos/${gh.repo}/contents/${gh.path.split("/").filter(Boolean).map(encodeURIComponent).join("/")}`}
const ghHead=()=>({Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
async function ghErr(r){let m="";try{m=(await r.json()).message||""}catch(e){}
  if(r.status===401)return new Error("GitHub rejected the token. It may have expired or been revoked. Make a new one and connect again.");
  if(r.status===404)return new Error(`Can't see ${gh.repo}. Check the repository name, and that the token was given access to it.`);
  if(r.status===403)return new Error(`The token isn't allowed to change ${gh.repo}. It needs Contents set to Read and write.${m?" ("+m+")":""}`);
  return new Error(`GitHub answered ${r.status}${m?": "+m:""}`)}
async function ghGet(){const r=await fetch(ghURL()+"?ref="+encodeURIComponent(gh.branch),{headers:ghHead(),cache:"no-store"});
  if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${gh.repo}`,{headers:ghHead(),cache:"no-store"});if(!rr.ok)throw await ghErr(rr);return{sha:null,data:null}}
  if(!r.ok)throw await ghErr(r);
  const j=await r.json();let data;try{data=JSON.parse(b64d(j.content||""))}catch(e){throw new Error(`${gh.path} in ${gh.repo} isn't Inquiry Grid data. Pick another file path.`)}
  return{sha:j.sha,data}}
async function ghPut(data,sha){const body={message:`Sync from ${gh.device||"a device"}`,content:b64e(JSON.stringify(data,replacer,2)+"\n"),branch:gh.branch};if(sha)body.sha=sha;
  const r=await fetch(ghURL(),{method:"PUT",headers:{...ghHead(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===409||r.status===422){const e=new Error("conflict");e.conflict=true;throw e}
  if(!r.ok)throw await ghErr(r)}
function applyMerged(m){roots=normalize(m.roots);deleted=m.deleted;if(sel&&!locate(sel))sel=null;persistLocal();
  const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#insp");
  renderPoster();renderMast();if(!typing)renderInsp()}
async function sync(){if(!ghOn())return;if(syncing){syncAgain=true;return}
  clearTimeout(syncT);
  if(!navigator.onLine){ghState="offline";paintSave();return}
  syncing=true;ghState="syncing";paintSave();
  try{
    for(let i=0;i<3;i++){
      const{sha,data}=await ghGet();
      const remote=data&&valid(data)?{roots:normalize(data.roots),deleted:data.deleted||{}}:{roots:[],deleted:{}};
      let m;if(example&&remote.roots.length){m=remote;example=false}else m=mergeData({roots,deleted},remote);
      if(canon(m)!==canon({roots,deleted}))applyMerged(m);
      if(!data||canon(m)!==canon(remote)){
        try{await ghPut({app:"inquiry-grid",version:2,savedAt:new Date().toISOString(),roots:m.roots,deleted:m.deleted},sha)}
        catch(e){if(e.conflict&&i<2)continue;if(e.conflict)throw new Error(`GitHub kept refusing the save. Check that the branch "${gh.branch}" exists.`);throw e}}
      break}
    lastSync=new Date();ghState="idle";ghMsg="";paintSave(true);
  }catch(e){ghState="error";ghMsg=e&&e.message?e.message:String(e);paintSave()}
  finally{syncing=false;if(syncAgain){syncAgain=false;ghSchedule(300)}}}
function ghSchedule(ms=1800){if(!ghOn())return;clearTimeout(syncT);if(!syncing&&ghState!=="error"){ghState="pending";paintSave()}syncT=setTimeout(sync,ms)}
function renderGh(){const box=$("#ghbox");if(!box)return;
  if(embedded){$("#ghst").textContent="GitHub sync works in the app itself, not in this preview.";$("#ghform").hidden=true;$("#ghconnect").hidden=true;$("#ghnow").hidden=true;$("#ghoff").hidden=true;return}
  const on=ghOn();$("#ghform").hidden=on;$("#ghconnect").hidden=on;$("#ghnow").hidden=!on;$("#ghoff").hidden=!on;
  let m;
  if(!on)m="";
  else if(ghState==="error")m="Sync failed: "+ghMsg;
  else if(ghState==="offline")m="Offline. Will sync when you're back.";
  else m=`${gh.repo}${lastSync?" · synced "+ago(lastSync):""}`;
  $("#ghst").textContent=m;$("#ghst").hidden=!m}
function fillGhForm(){$("#ghrepo").value=gh.repo;$("#ghdev").value=gh.device;$("#ghpath").value=gh.path;$("#ghbranch").value=gh.branch;$("#ghtok").value=""}
$("#ghconnect").onclick=async()=>{
  const repo=$("#ghrepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),tok=$("#ghtok").value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast("Repository should look like name/repo-name");return}
  if(!tok){toast("Paste your access token first");return}
  Object.assign(gh,{repo,token:tok,device:$("#ghdev").value.trim()||guessDevice(),path:$("#ghpath").value.trim()||"inquiry-grid.json",branch:$("#ghbranch").value.trim()||"main"});
  ghSaveCfg();$("#ghtok").value="";await sync();
  if(ghState==="idle")toast("Connected. Syncing with "+gh.repo)};
$("#ghnow").onclick=()=>sync();
$("#ghoff").onclick=()=>{gh.token="";ghSaveCfg();ghState="off";clearTimeout(syncT);fillGhForm();paintSave();toast("Disconnected. The token was removed from this browser.")};
function initGh(){fillGhForm();if(!ghOn()){paintSave();return}sync();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
  addEventListener("online",()=>sync());addEventListener("offline",()=>{ghState="offline";paintSave()});
  setInterval(()=>{if(document.visibilityState==="visible"&&ghState!=="error")sync()},60000)}
setInterval(()=>paintSave(),30000);

/* ---------- customize ---------- */
function themeCard(k,t){return`<button class="th" data-v="${k}" aria-pressed="${prefs.theme===k}"><span class="sw" style="background:${t.paper}"><i style="left:10px;top:10px;width:16px;height:16px;border:3px solid ${t.ink}"></i><i style="left:34px;top:10px;width:16px;height:16px;background:${t.a}"></i><i style="left:10px;bottom:9px;right:10px;height:5px;background:${t.ink}"></i><i style="right:-6px;top:4px;font:900 34px/1 Inter Tight,sans-serif;color:${t.ink};opacity:.9;letter-spacing:-.06em">01</i></span><span class="nm">${t.name}</span></button>`}
function applyPrefs(){
  const C=T(),r=document.documentElement;
  for(const[k,v]of Object.entries({paper:C.paper,surface:C.surface,ink:C.ink,"ink-2":C.ink2,grey:C.grey,hair:C.hair,a:C.a}))r.style.setProperty("--"+k,v);
  r.style.colorScheme=C.dark?"dark":"light";r.classList.toggle("still",!prefs.motion);
  let m=$('meta[name="theme-color"]');if(!m){m=document.createElement("meta");m.name="theme-color";document.head.append(m)}m.content=C.paper;
  $("#themes").innerHTML=Object.entries(THEMES).map(([k,t])=>themeCard(k,t)).join("");
  $("#spots").innerHTML=`<button class="spot" data-v="" aria-pressed="${!prefs.spot}" title="Theme's own spot colour">Auto</button>`+SPOTS.map(c=>`<button class="spot" data-v="${c}" aria-pressed="${prefs.spot===c}" style="background:${c}" aria-label="Spot colour ${c}"></button>`).join("");
  const set=(id,v)=>document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===(v?"1":"0")));
  set("guides",prefs.guides);set("huge",prefs.huge);set("axis",prefs.axis);set("motion",prefs.motion);
}
function restyle(fn){const go=()=>{fn();applyPrefs();save();render()};
  if(!still()&&document.startViewTransition)document.startViewTransition(go);else go()}
$("#themes").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.v!==prefs.theme)restyle(()=>prefs.theme=b.dataset.v)};
$("#spots").onclick=e=>{const b=e.target.closest("button");if(b)restyle(()=>prefs.spot=b.dataset.v)};
const opt=(id,k)=>$("#"+id).onclick=e=>{const b=e.target.closest("button");if(b){prefs[k]=b.dataset.v==="1";applyPrefs();save();render()}};
opt("guides","guides");opt("huge","huge");opt("axis","axis");opt("motion","motion");
function openPop(toData){const p=$("#pop");p.hidden=false;$("#custom").setAttribute("aria-expanded","true");if(toData)requestAnimationFrame(()=>$("#data").scrollIntoView({block:"nearest"}))}
function closePop(){$("#pop").hidden=true;$("#custom").setAttribute("aria-expanded","false")}
$("#custom").onclick=()=>$("#pop").hidden?openPop():closePop();
$("#closepop").onclick=closePop;

/* ---------- input ---------- */
$("#poster").addEventListener("click",e=>{const g=e.target.closest(".nd,.nd-t");if(g)select(g.dataset.id)});
$("#poster").addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest(".nd");if(g&&e.key==="Enter"){e.preventDefault();select(g.dataset.id)}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("#pop").hidden)closePop();else if(sel&&!(e.target.matches&&e.target.matches("input,textarea"))){sel=null;render()}}
  if(!sel)return;const t=e.target;
  if(t.matches&&t.matches("input,textarea,select"))return;
  if(t!==document.body&&!(t.closest&&t.closest("#field")))return;
  const L=locate(sel);if(!L)return;
  if(e.key==="Tab"){e.preventDefault();addBranch(L.node)}
  else if(e.key===" "){e.preventDefault();setStatus(L.node,ORDER[(ORDER.indexOf(L.node.status)+1)%4])}
  else if(e.key==="F2"){e.preventDefault();focusName()}
  else if(e.key==="Delete"){e.preventDefault();del(L.node)}
});
$("#add").onclick=addRoot;
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(renderPoster,150)});
